# The publisher's configuration, at /etc/lindfors-publisher.toml on mail.lindfors.no.
# Read by `site-tools publish` on every run. Every key has the default shown here.
#
# What to publish, and when, is not here: it is the writing desk's confirmed approval,
# read from its database as the writing_publisher role. The credential is not here
# either; `publish-locked` puts PUBLISHER_DATABASE_URL in the environment from the
# host/publisher bundle.

# A clone of the site repo the publisher account can push to, with its own deploy
# key. The run resets it to the remote branch before doing anything, so nothing kept
# in it survives except what is ignored (fonts/).
repo = "/srv/lindfors-publisher/site"

# The desk's content-addressed asset store, readable by the publisher through the
# writing-queue group; each blob is checked against its hash before it is used.
assets = "/srv/lindfors-writing/assets"

# Where a revision is laid out as a page bundle before it moves into the clone.
export = "/srv/lindfors-publisher/export"

# One JSON per slug the publisher has taken on: the record the desk reads back and a
# person finishes from. Outside the clone, publisher-owned, readable by the desk.
receipts = "/srv/lindfors-publisher/receipts"

# The zone the publication date is taken in.
timezone = "Europe/Oslo"

# Polled after the push until the page and the issue answer 200; the send waits on it.
site_url = "https://lindfors.no"
wait_minutes = 20

# The send, with the slug appended. sudo is what lets it read the newsletter's
# environment file; /etc/sudoers.d/lindfors-publisher allows exactly this command.
send_command = ["sudo", "/opt/lindfors-newsletter/send-issue"]

remote = "origin"
branch = "main"
