[package]
name = "site-tools"
version = "0.1.0"
edition = "2021"

# `cite` is on by default and is the only thing here that needs a C toolchain:
# crossref-client's HTTP stack and rusqlite's bundled SQLite. The publisher on
# mail.lindfors.no (Alpine, aarch64, musl) is built with `--no-default-features`, which
# leaves markdown, speech, pdf, og, newsletter gen and publish, all pure Rust, so it
# cross-compiles the way the newsletter binary does: a rustup target and rust-lld, no
# cross compiler. Citations are resolved on the workstation before a post is scheduled.
[features]
default = ["cite"]
cite = ["dep:crossref-client", "dep:rusqlite", "dep:tokio"]

[dependencies]
toml = "0.8"

# `publish`: ISO weeks, weekdays and the hour in a named time zone. Both pure Rust.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

# Two citation sources, neither required. A `@key` that is a DOI, or that the post's
# `[extra.bib]` maps to one, is resolved against crossref; anything left over falls back
# to a local Zotero library. A site that only ever writes DOIs never opens Zotero, and a
# post whose citations are already resolved touches neither.
#
# The Zotero side reads `zotero.sqlite` directly (see src/zotero.rs). Zotero 8 added a
# native `citationKey` field and Better BibTeX migrated into it, so there is no longer a
# separate Better BibTeX database to read and no reason for a crate in between.
crossref-client = { version = "0.2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

# crossref-client is async and this is a CLI. One current-thread runtime, built where
# the fetching happens, is the whole of the async surface here.
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }

# `hero`: the OpenRouter reply is JSON with the image inline as a base64 data URL. Both
# crates were already in the tree as dependencies of crossref-client.
serde_json = "1"
base64 = "0.22"
